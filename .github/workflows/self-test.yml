name: Self-test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tools:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML
      - run: python -X utf8 -m unittest discover -s tests -v
